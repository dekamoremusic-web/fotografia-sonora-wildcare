<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Fotografia sonora"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="theme-color" content="#ECEEEB"></head><body><title>Fotografia sonora</title>

<style>
/* Layout: una card per schermata, stile sondaggio per mobile; barra di avanzamento in alto, navigazione fissa in basso */
:root{
  --bg:#ECEEEB; --panel:#FFFFFF; --ink:#15171C; --muted:#4F555C; --line:#CDD1CC; --soft:#F4F5F3;
  --ton:#6B3FD9; --ton-t:#EEE8FC; --seg:#C2620F; --seg-t:#FDEDDD; --imp:#127A70; --imp-t:#D9F3F0; --cmp:#15171C; --cmp-t:#E4E7E3;
  --wave:#A2A8A1; --warn:#9A3412;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111311; --panel:#1B1E1B; --ink:#E9ECE9; --muted:#A7AEA7; --line:#363B36; --soft:#232723;
  --ton:#B79CFF; --ton-t:#2A2342; --seg:#F4A35A; --seg-t:#3A2919; --imp:#5ED6C9; --imp-t:#14332F; --cmp:#E9ECE9; --cmp-t:#2A2E2A;
  --wave:#5D655D; --warn:#F4A877; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111311; --panel:#1B1E1B; --ink:#E9ECE9; --muted:#A7AEA7; --line:#363B36; --soft:#232723;
  --ton:#B79CFF; --ton-t:#2A2342; --seg:#F4A35A; --seg-t:#3A2919; --imp:#5ED6C9; --imp-t:#14332F; --cmp:#E9ECE9; --cmp-t:#2A2E2A;
  --wave:#5D655D; --warn:#F4A877; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45}
.app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 0;box-sizing:border-box}
.top{display:flex;flex-direction:column;gap:8px;padding-bottom:12px}
.segs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.seg{display:flex;flex-direction:column;gap:4px;font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;color:var(--muted);text-transform:uppercase;min-width:0}
.seg i{display:block;height:4px;border-radius:2px;background:var(--line)}
.seg.done i{background:var(--c)} .seg.now i{background:linear-gradient(90deg,var(--c) var(--p),var(--line) var(--p))}
.seg.now{color:var(--ink)}
.stepno{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:right}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px 18px;display:flex;flex-direction:column;gap:16px;flex:1 0 auto;margin-bottom:12px}
.tag{align-self:flex-start;display:inline-flex;gap:8px;align-items:center;font-family:var(--mono);font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--acc);font-weight:500}
.tag b{width:10px;height:10px;border-radius:2px;background:var(--acc)}
h1{margin:0;font-size:34px;line-height:1.05;letter-spacing:-.01em;text-wrap:balance}
h2{margin:0;font-size:23px;line-height:1.2;text-wrap:balance}
p{margin:0}
.sub{color:var(--muted);font-size:15px}
.small{font-size:13px;color:var(--muted)}
.opts{display:flex;flex-direction:column;gap:10px}
.opts.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
button{font:inherit;color:inherit;cursor:pointer}
.opt{text-align:left;background:var(--soft);border:1.5px solid var(--line);border-radius:12px;padding:14px;min-height:56px;display:flex;gap:12px;align-items:center;width:100%;box-sizing:border-box}
.opt[aria-pressed="true"]{border-color:var(--acc);background:var(--tint);box-shadow:inset 0 0 0 1px var(--acc)}
.opt .txt{display:flex;flex-direction:column;gap:3px;min-width:0}
.opt .ttl{font-weight:600;font-size:16px;line-height:1.3}
.opt .dsc{font-size:13.5px;color:var(--muted);line-height:1.35}
.opt.shape{flex-direction:row;align-items:flex-start}
.opt.shape svg{flex-shrink:0}
.opt.busy{opacity:.55}
.fx{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:2px}
.fx span{border:1px solid var(--line);border-radius:4px;padding:1px 5px;background:var(--panel)}
.posture{display:flex;gap:10px;align-items:center;background:var(--tint);border-radius:10px;padding:10px 12px;font-size:14px}
.posture svg{flex-shrink:0}
.quote{border-left:3px solid var(--acc);padding:4px 0 4px 12px;font-size:16px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;box-sizing:border-box;min-height:46px;padding:10px 16px;border-radius:10px;border:1.5px solid var(--ink);background:transparent;font-weight:600;font-size:15px;line-height:1.2;text-align:center}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.acc{background:var(--acc);border-color:var(--acc);color:var(--bg)}
.btn.ghost{border-color:var(--line);font-weight:500}
.btn.wide{flex:1 1 0}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn svg{width:18px;height:18px}
button:focus-visible,.btn:focus-within,input:focus-visible{outline:2px solid var(--acc,var(--ink));outline-offset:2px}
.hidden-input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
canvas{width:100%;height:64px;display:block;border-radius:8px;background:var(--soft)}
.meta{font-family:var(--mono);font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-height:52px}
.switch input{width:22px;height:22px;accent-color:var(--acc)}
.qblock{display:flex;flex-direction:column;gap:10px}
.qblock h3{margin:0;font-size:17px}
.part{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--soft)}
.part .nm{font-weight:600}
.part .act{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.part label{display:flex;gap:8px;align-items:center;font-size:14px;min-height:44px}
.part .ctl{width:100%}
.part .ctl label{min-height:0}
.part.master{grid-template-columns:minmax(0,1fr);border-color:var(--ink)}
.opts.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.opts.three .opt{padding:10px;flex-direction:column;align-items:flex-start}
.part .act .btn{flex:1 1 0;min-width:0;padding:8px 6px;font-size:14px}
.part.master .qblock{margin-bottom:6px}
.btn.tog[aria-pressed="true"]{background:var(--tint);border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.part input{width:20px;height:20px;accent-color:var(--acc)}
.legend{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.legend li{display:flex;gap:10px;align-items:flex-start;font-size:14.5px}
.legend li b{flex-shrink:0;width:12px;height:12px;border-radius:3px;margin-top:5px}
.legend.shapes li{align-items:center}
.nav{position:sticky;bottom:0;background:var(--bg);display:flex;gap:10px;padding-top:10px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
.hint{font-size:12.5px;color:var(--muted);text-align:center;min-height:18px}
.status{font-size:13px;color:var(--muted)} .status.warn{color:var(--warn)}
dialog{border:none;padding:0;background:transparent;max-width:480px;width:100%;margin:auto auto 0;color:var(--ink)}
dialog::backdrop{background:rgba(10,12,10,.45)}
.sheet{background:var(--panel);border-radius:18px 18px 0 0;padding:18px max(18px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;max-height:85vh;overflow:auto;box-sizing:border-box}
.ctl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;font-size:14px}
.ctl output{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.ctl input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--acc);min-height:30px}
.chain{display:flex;flex-direction:column;gap:4px;font-family:var(--mono);font-size:11.5px;background:var(--soft);border-radius:8px;padding:10px}
.chain div::before{content:"→ ";color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app" id="app">

</div>

<dialog id="sheet" aria-labelledby="sheet-title">

<script>
(function(){

const KEYS = ['tonica', 'segnale', 'impronta'];
const S = {
  tonica:   { raw: null, name: '', shape: null, task: null, eff: null, mov: null, level: -10, wet: 0.6, mix: 0.7, mute: false, send: false, keep: true, proc: {}, pitch: {}, ver: 0 },
  segnale:  { raw: null, name: '', shape: null, task: null, eff: null, mov: null, level: -6, wet: 0.15, mix: 0.65, mute: false, send: false, keep: true, proc: {}, pitch: {}, ver: 0 },
  impronta: { raw: null, name: '', shape: null, task: null, eff: null, mov: null, level: 0, wet: 0.05, mix: 0.5, mute: false, send: false, keep: true, proc: {}, pitch: {}, ver: 0 }

/* master: temperatura finale e volume generale, regolati nel mixer */
const M = { temp: null, vol: 0 };
const TEMP = { neutro: { ls: 0, hs: 0, hf: 5000 }, caldo: { ls: 3, hs: -4, hf: 4500 }, freddo: { ls: -3, hs: 3, hf: 5000 } };
const SEND = 0.35;
const BREATH = { tonica: 14, segnale: 11, impronta: 17 };

/* ======================= DSP OFFLINE ======================= */
function rng(seed){ let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
function rms(x){ let s = 0; for (let i = 0; i < x.length; i++) s += x[i]*x[i]; return Math.sqrt(s/Math.max(1, x.length)); }

function toBuffer(x){ const b = new AudioBuffer({ length: x.length, numberOfChannels: 1, sampleRate: SR }); b.copyToChannel(x, 0); return b; }
function fft(re, im, inv){ const n = re.length;
  for (let i = 1, j = 0; i < n; i++){ let bit = n >> 1; for (; j & bit; bit >>= 1) j ^= bit; j ^= bit; if (i < j){ let t = re[i]; re[i] = re[j]; re[j] = t; t = im[i]; im[i] = im[j]; im[j] = t; } }
  for (let len = 2; len <= n; len <<= 1){ const ang = 2*Math.PI/len*(inv ? 1 : -1), h = len >> 1;
    for (let k = 0; k < h; k++){ const wr = Math.cos(ang*k), wi = Math.sin(ang*k);

  if (inv) for (let i = 0; i < n; i++){ re[i] /= n; im[i] /= n; } }

  const N = 16384, re = new Float64Array(N), im = new Float64Array(N), acc = new Float64Array(N/2), frames = Math.max(1, Math.min(8, Math.floor(x.length/N)));

    for (let i = 0; i < N; i++){ re[i] = (x[off + i] || 0)*(0.5 - 0.5*Math.cos(2*Math.PI*i/(N-1))); im[i] = 0; }

  for (let k = a; k <= b; k++){ tot += acc[k]; if (acc[k] > bv){ bv = acc[k]; best = k; } }

function findPeaks(x, r){
  const hop = 512, nf = Math.floor(x.length/hop), env = new Float32Array(nf);
  for (let f = 0; f < nf; f++){ let s = 0; for (let i = 0; i < hop; i++){ const v = x[f*hop + i]; s += v*v; } env[f] = Math.sqrt(s/hop); }

  const pk = []; for (let f = 6; f < nf - 6; f++){ if (env[f] < m + 0.5*sd) continue; let ok = true; for (let k = -6; k <= 6; k++) if (env[f+k] > env[f]){ ok = false; break; } if (ok) pk.push(Math.max(0, f*hop - Math.floor(0.01*SR))); }
  while (pk.length < 4) pk.push(Math.floor(r()*Math.max(1, x.length - SR))); return pk;
}
/* Beat repeat: ripete porzioni dei picchi su una griglia; opzioni per gate, guadagno, altezza e bit crush */
function beatRepeat(x, o){
  const r = rng(o.seed || 1), pk = findPeaks(x, r), beat = 60/o.bpm, n = Math.max(x.length, Math.floor((o.minSec || 8)*SR)), out = new Float32Array(n), fade = Math.floor(0.004*SR);
  for (let t = 0; (t + beat)*SR <= n; t += beat){
    const p = t*SR/n, ch = typeof o.chance === 'function' ? o.chance(p) : o.chance; if (r() > ch) continue;
    const start = pk[Math.floor(r()*pk.length)], div = (o.divAlt && r() < 0.35) ? o.divAlt : o.div;
    const slice = Math.floor(beat/div*SR), reps = Math.max(1, Math.round(beat*SR/slice)); let g = o.g0 || 1;
    for (let rep = 0; rep < reps; rep++){
      const rate = 1 + (o.rateStep == null ? -0.025 : o.rateStep)*rep, off = Math.floor(t*SR) + rep*slice;

        const ii = o.crush ? i - (i % 6) : i, sp = start + ii*rate, i0 = Math.floor(sp), fr = sp - i0;
        let v = x[i0 % x.length]*(1 - fr) + x[(i0 + 1) % x.length]*fr;

/* Granulatore: grani con finestra di Hann letti da una testina che scorre lungo il campione */
function granulate(x, o){

let sheetKey = null;
function chainLines(k){ const st = S[k], sec = SEC[k], o = effOpt(k), L = [];
  L.push('Base: ' + sec.baseFx.slice(0, -1).join(' · '));
  if (o) L.push('Fonte ' + Math.round((1 - st.mix)*100) + '% ∥ ' + o.fx.join(' → ') + ' ' + Math.round(st.mix*100) + '%');
  const p = o && st.pitch[st.eff]; if (p) L.push('Risonanze accordate su ' + p.f0.toFixed(1) + ' Hz' + (p.clear ? '' : ' (valore di riserva)'));
  L.push('Respiro automatico: livello tra −6 e 0 dB, ciclo ' + BREATH[k] + ' s');
  L.push('Riverbero ' + Math.round(st.wet*100) + '% · livello ' + fmtDb(st.level) + (st.mute ? ' (muto nel mixer)' : ''));
  L.push('Mixer: delay ' + (st.send ? 'attivo' : 'spento') + ' · temperatura master ' + (M.temp || 'neutra'));
  return L; }
function openSheet(k){ sheetKey = k; refreshSheet(); const d = $('sheet'); if (!d.open){ try { d.showModal(); } catch (e) { d.setAttribute('open', ''); } } }
function refreshSheet(){ if (!sheetKey) return; const k = sheetKey, st = S[k], sec = SEC[k], body = $('sheetBody'); body.setAttribute('style', accStyle(k));
  body.innerHTML = '<div class="tag"><b></b>' + sec.n + ' · ' + sec.name + '</div><h2 id="sheet-title">Gestisci campione ed effetti</h2>'
    + '<div class="meta">' + (st.raw ? st.name + ' · ' + (st.raw.length/SR).toFixed(1) + ' s' : 'Nessun suono') + '</div>'
    + '<div class="row"><label class="btn ghost wide" for="sheet-file">Sostituisci il suono</label><input class="hidden-input" type="file" id="sheet-file" accept="audio/*" capture data-k="' + k + '">'
    + '<button class="btn ghost wide" type="button" data-sact="example">Usa l’esempio</button></div>'
    + '<div class="row">' + playBtn('solo-' + k, 'Ascolta solo') + '</div>'
    + slider('level', 'Livello traccia', -36, 6, 1, st.level, (st.level > 0 ? '+' : '') + st.level + ' dB')
    + slider('wet', k === 'tonica' ? 'Riverbero di base (dry/wet)' : 'Riverbero (mandata)', 0, 100, 1, Math.round(st.wet*100), Math.round(st.wet*100) + '%')
    + slider('mix', 'Riconoscibilità: fonte ↔ effetto', 0, 100, 1, Math.round(st.mix*100), st.eff ? Math.round(st.mix*100) + '% effetto' : 'nessun effetto scelto')
    + '<div class="chain">' + chainLines(k).map((l) => '<div>' + l + '</div>').join('') + '</div>'
    + '<button class="btn primary" type="button" data-sact="close">Chiudi</button>';
  refreshPlayButtons(); }
function slider(id, label, mn, mx, stp, val, out){ return '<div class="ctl"><label for="sl-' + id + '">' + label + '</label><output id="sl-' + id + '-o" for="sl-' + id + '">' + out + '</output><input type="range" id="sl-' + id + '" data-sl="' + id + '" min="' + mn + '" max="' + mx + '" step="' + stp + '" value="' + val + '"></div>'; }
$('sheetBody').addEventListener('input', (ev) => { const t = ev.target, id = t.dataset.sl; if (!id) return; const k = sheetKey, st = S[k], L = playing && playing.live[k];
  if (id === 'level'){ st.level = +t.value; liveTrack(k); }
  if (id === 'wet'){ st.wet = t.value/100; if (L){ L.wet.gain.value = st.wet; if (k === 'tonica') L.dry.gain.value = 1 - st.wet; } }
  if (id === 'mix'){ st.mix = t.value/100; if (L && L.transG){ L.transG.gain.value = st.mix; L.origG.gain.value = 1 - st.mix; } }
  $('sl-' + id + '-o').textContent = id === 'level' ? (st.level > 0 ? '+' : '') + st.level + ' dB' : id === 'wet' ? Math.round(st.wet*100) + '%' : (st.eff ? Math.round(st.mix*100) + '% effetto' : 'nessun effetto scelto');
  const ch = $('sheetBody').querySelector('.chain'); if (ch) ch.innerHTML = chainLines(k).map((l) => '<div>' + l + '</div>').join(''); });
$('sheetBody').addEventListener('change', async (ev) => { const t = ev.target; if (t.type === 'file') await loadFile(t); });
$('sheetBody').addEventListener('click', (ev) => { const b = ev.target.closest('[data-act],[data-sact]'); if (!b || b.tagName === 'INPUT') return;
  if (b.dataset.sact === 'close'){ closeSheet(); return; }
  if (b.dataset.sact === 'example'){ setSample(sheetKey, synth(sheetKey), EXNAME[sheetKey]); refreshSheet(); restart(); }
  else if (b.dataset.act === 'play'){ const tag = b.dataset.tag; if (playing && playing.tag === tag) stop(); else play([sheetKey], tag); } });
function afterSheetClosed(){ sheetKey = null; renderCard(); }
/* chiusura diretta: il visualizzatore blocca l'invio dei moduli, quindi niente form method="dialog" */
function closeSheet(){ const d = $('sheet'); if (!d.open && !d.hasAttribute('open')) return;
  let closed = false; try { d.close(); closed = !d.open; } catch (e) {}
  if (!closed){ d.removeAttribute('open'); afterSheetClosed(); } }
$('sheet').addEventListener('close', afterSheetClosed);
$('sheet').addEventListener('click', (ev) => { if (ev.target === $('sheet')) closeSheet(); });

/* ======================= ESPORTAZIONE ======================= */
function wav(buf){ const n = buf.length, ch = buf.numberOfChannels, ab = new ArrayBuffer(44 + n*ch*2), v = new DataView(ab), w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  w(0, 'RIFF'); v.setUint32(4, 36 + n*ch*2, true); w(8, 'WAVE'); w(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, ch, true); v.setUint32(24, SR, true); v.setUint32(28, SR*ch*2, true); v.setUint16(32, ch*2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, n*ch*2, true);
  const d = []; for (let c = 0; c < ch; c++) d.push(buf.getChannelData(c)); let o = 44;
  for (let i = 0; i < n; i++) for (let c = 0; c < ch; c++){ const s = Math.max(-1, Math.min(1, d[c][i])); v.setInt16(o, s < 0 ? s*0x8000 : s*0x7FFF, true); o += 2; } return new Uint8Array(ab); }
const CRC = (() => { const t = new Uint32Array(256); for (let i = 0; i < 256; i++){ let c = i; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[i] = c >>> 0; } return t; })();
function crc32(u){ let c = 0xFFFFFFFF; for (let i = 0; i < u.length; i++) c = CRC[(c ^ u[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function zip(files){ const enc = new TextEncoder(), parts = [], central = []; let off = 0;
  for (const f of files){ const name = enc.encode(f.name), crc = crc32(f.data), sz = f.data.length, h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint32(14, crc, true); h.setUint32(18, sz, true); h.setUint32(22, sz, true); h.setUint16(26, name.length, true); parts.push(new Uint8Array(h.buffer), name, f.data);
    const cd = new DataView(new ArrayBuffer(46)); cd.setUint32(0, 0x02014b50, true); cd.setUint16(4, 20, true); cd.setUint16(6, 20, true); cd.setUint32(16, crc, true); cd.setUint32(20, sz, true); cd.setUint32(24, sz, true); cd.setUint16(28, name.length, true); cd.setUint32(42, off, true);
    central.push(new Uint8Array(cd.buffer), name); off += 30 + name.length + sz; }
  const cs = central.reduce((a, u) => a + u.length, 0), e = new DataView(new ArrayBuffer(22)); e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true); e.setUint32(12, cs, true); e.setUint32(16, off, true);
  return new Blob([...parts, ...central, new Uint8Array(e.buffer)], { type: 'application/zip' }); }
/* Salvataggio in due tempi: prima si prepara l'archivio (calcolo lungo), poi un secondo tocco lo salva.
   Il secondo tocco serve ai browser del telefono, che accettano un download o una condivisione solo
   come risposta immediata a un gesto dell'utente. */
let downloads = null, downloadsChecked = false, prepared = null, busy = false;
if (IN_VIEWER && window.claude.use) window.claude.use('downloads').then((d) => { downloads = d; downloadsChecked = true; if (STEPS[step].t === 'lascia') renderCard(); }).catch(() => { downloadsChecked = true; });
function exportSig(){ return JSON.stringify([KEYS.map((k) => { const st = S[k]; return [st.ver, st.keep, st.eff, st.level, st.wet, st.mix, st.send, st.mute]; }), M]); }
function canShareFiles(){ try { return !IN_VIEWER && !!navigator.canShare && navigator.canShare({ files: [new File([new Uint8Array(1)], 'x.zip', { type: 'application/zip' })] }); } catch (e) { return false; } }
function saveHtml(){
  if (prepared && prepared.sig !== exportSig()) prepared = null;
  if (IN_VIEWER && downloadsChecked && !downloads) return '<p class="status warn">In questa vista di Claude il salvataggio dei file non è disponibile. Apri la web app dal browser (per esempio da GitHub Pages) per salvare.</p>';
  if (!prepared) return '<button class="btn acc" type="button" data-act="export" id="exportBtn"' + (busy ? ' disabled' : '') + '>' + (busy ? 'Preparo l’archivio…' : 'Prepara la fotografia sonora (.zip)') + '</button>';
  const mb = (prepared.blob.size/1048576).toFixed(1);
  return '<p class="small">Archivio pronto: ' + prepared.fname + ', ' + mb + ' MB.</p><div class="row">'
    + '<button class="btn acc wide" type="button" data-act="save">Salva il file</button>'
    + (canShareFiles() ? '<button class="btn ghost wide" type="button" data-act="share">Condividi o salva su File</button>' : '') + '</div>';
}
function errText(e){ const c = e && e.code;
  if (c === 'declined') return 'Salvataggio annullato.';
  if (c === 'too_large') return 'L’archivio è troppo grande per questa vista: lascia meno parti e riprova.';
  if (c === 'rejected_extension' || c === 'extension_not_enabled') return 'In questa vista non si possono salvare file .zip.';
  if (c === 'rate_limited') return 'C’è già una richiesta di salvataggio aperta: rispondi a quella e riprova.';
  if (c === 'unavailable' || c === 'not_granted' || c === 'capability_disabled' || c === 'capability_removed') return 'Il salvataggio non è disponibile in questa vista.';
  return 'Salvataggio non riuscito' + (c ? ' (codice ' + c + ')' : e && e.message ? ' (' + e.message + ')' : '') + '.'; }
async function saveZip(){
  if (!prepared) return; const { blob, fname } = prepared;
  try {
    if (IN_VIEWER){ if (!downloads){ setStatus('Il salvataggio non è disponibile in questa vista.', true); return; } await downloads.save({ filename: fname, data: blob }); setStatus('Archivio salvato.'); return; }
    const url = URL.createObjectURL(blob), a = document.createElement('a'); a.href = url; a.download = fname; a.rel = 'noopener'; document.body.appendChild(a); a.click();
    setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 60000);
    setStatus('Download avviato. Su iPhone, se non compare, usa «Condividi o salva su File».');
  } catch (e) { setStatus(errText(e), true); }
}
async function shareZip(){
  if (!prepared) return;
  try { await navigator.share({ files: [new File([prepared.blob], prepared.fname, { type: 'application/zip' })], title: 'Fotografia sonora' }); setStatus('Archivio condiviso.'); }
  catch (e) { setStatus(e && e.name === 'AbortError' ? 'Condivisione annullata.' : 'Condivisione non riuscita: usa «Salva il file».', true); }
}
async function exportZip(){
  const keys = KEYS.filter((k) => S[k].keep && S[k].raw); if (!keys.length){ setStatus('Scegli almeno una parte da lasciare.', true); return; }
  busy = true; renderCard();
  try { setStatus('Calcolo il mix e le tracce (30 s): può richiedere qualche secondo…');
    const files = [{ name: '0_mix.wav', data: wav(await renderKeys(keys, 30)) }];
    for (const k of keys) files.push({ name: SEC[k].n + '_' + k + '.wav', data: wav(await renderKeys([k], 30)) });
    const info = { master: { temperatura: M.temp || 'neutro', volume_dB: M.vol } }; for (const k of KEYS){ const st = S[k], sh = shapeOf(k), o = effOpt(k);
      info[k] = { lasciata: st.keep && !!st.raw, forma: sh ? sh.sides + ' lati (' + sh.card + ')' : null, postura: sh ? POSTURE[sh.sides].t : null, suggerimento: sh && st.task != null ? sh.tasks[st.task] : null, sorgente: st.name, risposta: o ? o.t : null, catena: o ? o.fx : null, respiro_s: BREATH[k], livello_dB: st.level, delay_mixer: st.send, muto_nel_mixer: st.mute, riverbero: st.wet, riconoscibilita_effetto: st.mix }; }
    files.push({ name: 'scelte.json', data: new TextEncoder().encode(JSON.stringify(info, null, 2)) });
    const d = new Date(), stamp = d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0') + '-' + String(d.getHours()).padStart(2, '0') + String(d.getMinutes()).padStart(2, '0');
    prepared = { blob: zip(files), fname: 'fotografia-sonora-' + stamp + '.zip', sig: exportSig() };
    busy = false; renderCard(); setStatus('Archivio pronto: tocca «Salva il file».');
  } catch (e) { busy = false; renderCard(); setStatus('Non riesco a preparare l’archivio' + (e && e.message ? ' (' + e.message + ')' : '') + '.', true); }
}

renderCard();
window.__fs = { S, SEC, ensureProc, renderKeys, setSample, synth, KEYS };
})();
