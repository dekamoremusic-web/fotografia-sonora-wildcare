<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fotografia sonora</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fotografia sonora">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#E0532C">
<meta name="color-scheme" content="light">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@500;600;700&family=Inter:wght@900&display=swap">
<style>
/* Dispositivo ibrido: scocca e tasti alla Teenage Engineering, schermo LCD alla Game & Watch.
   Colori e misure dal frame Figma «1.4 Tonica · Rack (prototipo)» e dalle variabili rack/* */
:root{
  --scocca:#E0532C; --tasto:#DDDCCA; --base:#15171C; --avanti:#3C3E23; --lcd:#D7D2C6; --rec:#E0532C; --giallo:#FBF231;
  --ink:#15171C; --ink2:#47453F; --ghost:rgba(21,23,28,.075); --fondo:#2B2118;
  --ton:#6B3FD9; --seg:#C2620F; --imp:#127A70;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --key-h:64px; --press:7px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--fondo)}
body{font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- scocca ---------- */
.device{position:relative;max-width:440px;height:100vh;height:100dvh;margin:0 auto;background:var(--scocca);display:flex;flex-direction:column;gap:10px;
  padding:max(12px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background-image:radial-gradient(120% 60% at 30% 0%,rgba(255,255,255,.10),transparent 60%)}
@media (min-width:560px) and (min-height:700px){
  body{display:grid;place-items:center;padding:24px}
  .device{height:min(956px,calc(100dvh - 48px));width:440px;border-radius:44px;box-shadow:0 2px 0 rgba(255,255,255,.25) inset,0 -6px 0 rgba(0,0,0,.18) inset,0 30px 60px rgba(0,0,0,.55)}
}

/* avanzamento: barre come i LED di un sequencer */
.prog{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;flex:none}
.prog div{display:flex;flex-direction:column;gap:5px;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--ink);text-transform:uppercase}
.prog i{display:block;height:4px;border-radius:2px;background:rgba(21,23,28,.28);overflow:hidden}
.prog i b{display:block;height:100%;width:var(--p,0%);background:var(--giallo);transition:width .3s}
.prog .now{font-weight:600}

/* ---------- LCD ---------- */
.bezel{flex:1 1 auto;min-height:0;background:var(--base);border-radius:30px;padding:7px;display:flex;flex-direction:column;
  box-shadow:0 1px 0 rgba(255,255,255,.25),inset 0 2px 3px rgba(0,0,0,.6)}
.lcd{position:relative;flex:1;min-height:0;background:var(--lcd);border-radius:24px;display:flex;flex-direction:column;overflow:hidden;
  box-shadow:inset 0 3px 6px rgba(0,0,0,.18),inset 0 0 0 1px rgba(21,23,28,.10);
  background-image:repeating-linear-gradient(0deg,rgba(21,23,28,.025) 0 1px,transparent 1px 3px),radial-gradient(140% 90% at 20% 0%,rgba(255,255,255,.35),transparent 55%)}
.lcd-head{display:flex;align-items:center;gap:8px;padding:14px 18px 8px;font-family:var(--mono);font-weight:500;font-size:11px;letter-spacing:.06em;text-transform:uppercase;flex:none}
.lcd-head .sq{width:10px;height:10px;border-radius:2px;background:var(--acc,var(--scocca));flex:none}
.lcd-head .cnt{margin-left:auto;display:flex;align-items:center;gap:6px}
.lcd-body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:4px 18px 12px;display:flex;flex-direction:column;gap:12px;scrollbar-width:thin;scrollbar-color:rgba(21,23,28,.35) transparent}
.lcd-foot{flex:none;padding:8px 18px 13px;font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;text-align:center;min-height:32px;color:var(--ink);border-top:1px dashed rgba(21,23,28,.18)}
.lcd-foot.warn{animation:blink .9s steps(2,end) 3}
@keyframes blink{50%{opacity:.15}}
.lcd h1{margin:4px 0 0;font-size:30px;line-height:1.02;letter-spacing:-.01em;font-weight:700;text-wrap:balance}
.lcd h2{margin:0;font-size:19px;line-height:1.22;font-weight:700;text-wrap:balance}
.lcd p{margin:0}
.lcd .txt{font-size:15px;line-height:1.42;color:var(--ink2)}
.lcd .quote{font-size:18px;line-height:1.35;font-weight:600;border-left:3px solid var(--ink);padding:2px 0 2px 12px;text-wrap:pretty}
.lcd .mono{font-family:var(--mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase}
.seg7{display:inline-block;vertical-align:middle}
.seg7 .off{fill:var(--ghost)} .seg7 .on{fill:var(--ink)}

/* righe selezionabili: cursore pieno come nel Figma */
.sel{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:transparent;border:1.5px solid var(--ink);border-radius:14px;padding:12px 14px;min-height:56px}
.sel[aria-pressed="true"]{background:var(--ink);color:var(--lcd)}
.sel[aria-pressed="true"] .led{background:var(--rec);box-shadow:0 0 6px var(--rec)}
.sel .t{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.sel .t b{font-size:15.5px;line-height:1.25;font-weight:600}
.sel .t small{font-size:13px;line-height:1.3;opacity:.82}
.sel svg{flex:none}
.led{width:10px;height:10px;border-radius:50%;background:var(--ghost);flex:none}
.lcdbtn{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;background:transparent;border:1.5px solid var(--ink);border-radius:10px;padding:0 12px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.lcdbtn[aria-pressed="true"],.lcdbtn.on{background:var(--ink);color:var(--lcd)}
.lcdbtn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1 1 0}
.legend{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none;font-size:14.5px;line-height:1.35}
.legend li{display:flex;gap:10px;align-items:flex-start}
.legend b.c{flex:none;width:11px;height:11px;border-radius:2px;margin-top:4px}
.posture{display:flex;gap:10px;align-items:center;border:1.5px dashed rgba(21,23,28,.4);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.35}

/* forma d'onda città e superficie */
.city{width:100%;aspect-ratio:2/1.15;display:block}
.recbar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.padwrap{position:relative;width:100%;max-width:min(100%,40vh,40dvh);margin:0 auto;padding:16px}
.lcd[data-step=effetto] h2{font-size:16px;line-height:1.25}
.lcd[data-step=effetto] .lcd-body{gap:6px}
.pad{position:relative;width:100%;aspect-ratio:1;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:crosshair;border-radius:6px;outline-offset:4px}
.pad canvas{width:100%;height:100%;display:block}
.pad.wait{opacity:.4;cursor:progress}
.edge{position:absolute;font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;display:flex;align-items:center;gap:5px;opacity:0;transition:opacity .4s;pointer-events:none;white-space:nowrap}
.edge i{width:8px;height:8px;border-radius:2px}
.revealed .edge{opacity:1}
.edge.A{right:0;top:50%;transform:translate(50%,-50%) rotate(90deg);transform-origin:center}
.edge.C{left:0;top:50%;transform:translate(-50%,-50%) rotate(-90deg)}
.edge.B{top:-2px;left:50%;transform:translateX(-50%)}
.edge.D{bottom:-2px;left:50%;transform:translateX(-50%)}
.readout{display:flex;flex-direction:column;gap:3px;min-height:52px}
.readout .now{display:flex;gap:8px;align-items:flex-start;font-weight:700;font-size:16.5px;line-height:1.25}
.readout .now i{flex:none;width:11px;height:11px;border-radius:2px;margin-top:4px}
.readout .pct{font-family:var(--mono);font-size:10.5px;letter-spacing:.03em;color:var(--ink2)}
.meter{display:inline-flex;gap:2px;vertical-align:middle}
.meter i{width:6px;height:10px;background:var(--ghost);border-radius:1px}
.meter i.on{background:var(--ink)}

/* mixer */
.strips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.strip{display:flex;flex-direction:column;align-items:center;gap:8px;border:1.5px solid var(--ink);border-radius:14px;padding:10px 6px}
.strip.focus{box-shadow:inset 0 0 0 2px var(--ink)}
.strip .nm{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;display:flex;gap:5px;align-items:center;background:none;border:0;padding:4px;min-height:32px}
.fader{display:flex;flex-direction:column-reverse;gap:3px;width:44px;padding:4px 6px;touch-action:none;cursor:ns-resize;border-radius:6px}
.fader i{height:7px;background:var(--ghost);border-radius:1px}
.fader i.on{background:var(--ink)}
.strip .db{font-family:var(--mono);font-size:10.5px;font-variant-numeric:tabular-nums}
.strip .lcdbtn{min-height:36px;width:100%;padding:0 4px;font-size:10px}
.temp{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}

/* ---------- pannello comandi ---------- */
.deck{flex:none;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 70px;grid-template-rows:auto auto;column-gap:16px;row-gap:6px;align-items:start;padding:2px 2px 0}
.ctl{display:flex;flex-direction:column;align-items:center;gap:7px;min-width:0}
.silk{font-family:var(--mono);font-weight:500;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);user-select:none}
.key{position:relative;border:0;padding:0;background:var(--tasto);color:var(--avanti);display:grid;place-items:center;margin-bottom:var(--press);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.55),inset 0 -3px 0 rgba(0,0,0,.08),0 var(--press) 0 var(--base),0 calc(var(--press) + 4px) 6px rgba(0,0,0,.35);
  transition:transform .06s,box-shadow .06s}
.key.round{width:var(--key-h);height:var(--key-h);border-radius:50%}
.key.rect{width:100%;height:var(--key-h);border-radius:24px}
.key.go{background:var(--avanti);color:var(--tasto);font-family:'Inter',var(--sans);font-weight:900;font-size:20px;letter-spacing:-.01em}
.key:active:not([aria-disabled="true"]),.key.down{transform:translateY(calc(var(--press) - 2px));box-shadow:inset 0 2px 0 rgba(255,255,255,.4),0 2px 0 var(--base),0 3px 3px rgba(0,0,0,.3)}
.key[aria-disabled="true"]>*{opacity:.35}
.key:focus-visible,.wheel:focus-visible,.sel:focus-visible,.lcdbtn:focus-visible,.pad:focus-visible,.strip .nm:focus-visible,.fader:focus-visible{outline:3px solid var(--giallo);outline-offset:3px}
.key .dot{width:18px;height:18px;border-radius:50%;background:var(--rec)}
.key.recording .dot{border-radius:4px;animation:blink 1s steps(2,end) infinite}
.key svg{width:26px;height:26px}
.wheelbox{grid-column:3;grid-row:1 / span 2;align-self:stretch;display:flex;flex-direction:column;align-items:center;gap:7px}
.wheel{position:relative;flex:1;width:100%;min-height:120px;border:1px solid var(--base);border-radius:8px;background:var(--tasto);overflow:hidden;touch-action:none;cursor:ns-resize;
  box-shadow:0 4px 4px rgba(0,0,0,.5)}
.wheel i{position:absolute;left:0;right:0;height:1px;background:var(--base)}
.wheel::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.45),rgba(0,0,0,0) 30%,rgba(255,255,255,.25) 50%,rgba(0,0,0,0) 70%,rgba(0,0,0,.45));pointer-events:none}
.wheel[aria-disabled="true"]{filter:saturate(.5) brightness(.85)}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
@media (max-height:700px){ :root{--key-h:54px;--press:6px} .padwrap{max-width:min(100%,33vh,33dvh)} .lcd h1{font-size:26px} .lcd .quote{font-size:16px} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="device" id="device">
  <div class="prog" id="prog" aria-hidden="true"></div>
  <div class="bezel">
    <main class="lcd" id="lcd" aria-labelledby="scr-title">
      <div class="lcd-head" id="lcdHead"></div>
      <div class="lcd-body" id="lcdBody"></div>
      <div class="lcd-foot" id="foot" role="status" aria-live="polite"></div>
    </main>
  </div>
  <div class="deck" role="group" aria-label="Comandi">
    <div class="ctl"><button class="key round" id="kRec" type="button" aria-label="Registra"><span class="dot"></span></button><span class="silk" aria-hidden="true">Rec</span></div>
    <div class="ctl"><button class="key round" id="kPlay" type="button" aria-label="Ascolta"><svg viewBox="0 0 24 24" aria-hidden="true" id="playIco"><polygon points="7,4 20,12 7,20" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg></button><span class="silk" aria-hidden="true">Play</span></div>
    <div class="wheelbox"><div class="wheel" id="wheel" tabindex="0" role="slider" aria-label="Rotella" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"></div><span class="silk" aria-hidden="true">▲ Scegli ▼</span></div>
    <div class="ctl"><button class="key rect" id="kBack" type="button" aria-label="Indietro"><svg viewBox="0 0 36 28" aria-hidden="true" style="width:34px;height:26px"><path d="M30 4v8a4 4 0 0 1-4 4H8" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/><path d="M13 10l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button><span class="silk" aria-hidden="true">Indietro</span></div>
    <div class="ctl"><button class="key rect go" id="kNext" type="button"><span id="nextLbl">Inizia</span></button><span class="silk" aria-hidden="true">Conferma</span></div>
  </div>
</div>
<input type="file" id="file-in" accept="audio/*" tabindex="-1" aria-hidden="true">
<script>
(function(){
'use strict';
const SR = 44100;
const IN_VIEWER = !!window.claude;
let ctx = null;
const $ = (id) => document.getElementById(id);

/* ======================= DATI DEL PERCORSO ======================= */
const SHAPES = { RG: '1,5 23,5 23,19 1,19', Q: '3,3 21,3 21,21 3,21', RP: '4,8 20,8 20,16 4,16', T: '12,2 22.5,21 1.5,21' };
/* due dispositivi: lo sgabello invita a fermarsi, il cono all'ascolto direzionale */
const POSTURE = {
  4: { n: 'Sgabello', t: 'Ascolto seduto e diffuso', d: 'Siediti e resta fermo. Lascia arrivare il suono da ogni direzione, senza cercarne uno in particolare.' },
  3: { n: 'Cono', t: 'Ascolto puntuale', d: 'Resta in piedi o in movimento. Scegli una direzione e avvicinati a una sola fonte.' }
};
const SEC = {
  tonica: { n: 1, name: 'Tonica', acc: '--ton', def: 'lo sfondo continuo del luogo',
    shapes: [
      { id: 'rett', sides: 4, poly: 'RG', color: '#1f3a6b', tasks: ['Trova il suono di sottofondo: quello che suonava prima che arrivassi e suonerà dopo.', 'Trova il suono che domina questo luogo: il traffico, la folla, il brusio.'] },
      { id: 'tri', sides: 3, poly: 'T', color: '#e07a1f', tasks: ['Cammina finché non trovi un punto dove il rumore di fondo suona un po’ meglio che altrove. Registra da qui.'] } ],
    q: 'Stiamo ascoltando la città, adesso proviamo a farla suonare. Che cosa ti suggerisce il suono che hai appena registrato?',
    opts: [ { v: 'A', s: 'Ritmo', t: 'Un ripetersi a tratti ritmico' },
            { v: 'B', s: 'Massa', t: 'Una massa densa che avvolge lo spazio' },
            { v: 'C', s: 'Trama', t: 'Una trama che si propaga costante come sfondo' } ] },
  segnale: { n: 2, name: 'Segnale', acc: '--seg', def: 'ciò che emerge e chiama l’attenzione',
    shapes: [
      { id: 'quad', sides: 4, poly: 'Q', color: '#3f8f4f', tasks: ['Concentrati su un suono che alle tue orecchie si distingue dagli altri. Prova a registrare solo quello.'] },
      { id: 'tri', sides: 3, poly: 'T', color: '#e07a1f', tasks: ['Fai scorrere lentamente il telefono su una superficie: mattone, tessuto, metallo, corteccia. Il suono è il contatto stesso con la materia.'] } ],
    q: 'Se il suono che hai appena registrato fosse uno strumento, quale sarebbe?',
    opts: [ { v: 'A', s: 'Percussione', t: 'Una percussione, qualcosa che si suona colpendolo' },
            { v: 'B', s: 'Fiato', t: 'Un fiato, qualcosa che suona con il passaggio dell’aria' },
            { v: 'C', s: 'Corda', t: 'Una corda, qualcosa che suona per sfregamento o viene pizzicata' } ] },
  impronta: { n: 3, name: 'Impronta sonora', acc: '--imp', def: 'il suono che appartiene solo a questo posto',
    shapes: [
      { id: 'rett', sides: 4, poly: 'RP', color: '#6fa8dc', tasks: ['C’è un suono che vuoi portare con te di questo luogo? Trova qualcosa che gli somigli e registralo prima che diventi solo un ricordo.'] },
      { id: 'tri', sides: 3, poly: 'T', color: '#c8352b', tasks: ['Scegli un suono fragile: uno che si affievolisce, raro, che nessun altro sembra notare ma sembra stare solo qui.'] } ],
    q: 'L’ultimo suono che hai registrato sarà la firma sonora di questo posto. Cosa ti provoca?',
    opts: [ { v: 'A', s: 'Nostalgia', t: 'Una strana nostalgia' },
            { v: 'B', s: 'Curiosità', t: 'Una sincera curiosità' },
            { v: 'C', s: 'Fastidio', t: 'Un qualche tipo di fastidio' } ] }
};
const KEYS = ['tonica', 'segnale', 'impronta'];
const S = {
  tonica:   { raw: null, name: '', shape: null, task: null, eff: null, pad: null, level: -10, wet: 0.6, mix: 0.7, mute: false, send: false, keep: true, proc: {}, pitch: {}, ver: 0 },
  segnale:  { raw: null, name: '', shape: null, task: null, eff: null, pad: null, level: -6, wet: 0.15, mix: 0.65, mute: false, send: false, keep: true, proc: {}, pitch: {}, ver: 0 },
  impronta: { raw: null, name: '', shape: null, task: null, eff: null, pad: null, level: 0, wet: 0.05, mix: 0.6, mute: false, send: false, keep: true, proc: {}, pitch: {}, ver: 0 }
};
/* master: temperatura finale e volume generale, regolati nel mixer */
const M = { temp: null, vol: 0 };
const TEMP = { neutro: { ls: 0, hs: 0, hf: 5000 }, caldo: { ls: 3, hs: -4, hf: 4500 }, freddo: { ls: -3, hs: 3, hf: 5000 } };
const SEND = 0.35;
const BREATH = { tonica: 14, segnale: 11, impronta: 17 };

/* ======================= SUPERFICIE SONORA ======================= */
/* Quattro poli ai bordi del piano: destra = A, alto = B, sinistra = C, basso = D (suono originale).
   Il peso di ogni polo decresce con la distanza dal dito (gaussiana) e i pesi sono normalizzati:
   al centro valgono 25% ciascuno, su un bordo il polo vicino arriva all'87%. */
const PAD = { cells: 13, sigma: 0.6, poles: [
  { v: 'A', x: 1, y: 0, col: '#E0532C' },
  { v: 'B', x: 0, y: 1, col: '#2E4057' },
  { v: 'C', x: -1, y: 0, col: '#6B3FD9' },
  { v: 'D', x: 0, y: -1, col: '#15171C' } ] };
const DRY = { s: 'Originale', t: 'Il suono così com’è, senza trasformazioni' };
function padWeights(p){ const w = {}; let s = 0;
  for (const q of PAD.poles){ const d2 = (p.x - q.x)*(p.x - q.x) + (p.y - q.y)*(p.y - q.y); w[q.v] = Math.exp(-d2/(2*PAD.sigma*PAD.sigma)); s += w[q.v]; }
  for (const v in w) w[v] /= s; return w; }
function padDominant(w){ let best = 'D', bv = -1; for (const v in w) if (w[v] > bv){ bv = w[v]; best = v; } return best; }
/* pesi degli effetti di una traccia: dalla superficie se è stata toccata, altrimenti dalla risposta scelta */
function stWeights(st){ if (st.pad) return padWeights(st.pad); return st.eff ? { [st.eff]: 1 } : {}; }
function padOpt(k, v){ return v === 'D' ? DRY : SEC[k].opts.find((o) => o.v === v); }

/* ======================= DSP OFFLINE ======================= */
function rng(seed){ let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
function rms(x){ let s = 0; for (let i = 0; i < x.length; i++) s += x[i]*x[i]; return Math.sqrt(s/Math.max(1, x.length)); }

/* ======================= TRASPORTO ======================= */
let playing = null;
function ensureCtx(){ if (!ctx) ctx = new AudioContext({ sampleRate: SR }); if (ctx.state === 'suspended') ctx.resume(); return ctx; }
function stop(){ if (!playing) return; for (const s of playing.stops){ try { s.stop(); } catch (e) {} } try { playing.bus.disconnect(); } catch (e) {} playing = null; updateKeys(); }
function play(keys, tag, liveEdit){
  const c = ensureCtx(); stop(); const bus = gn(c, 1); bus.connect(c.destination);
  const g = buildAll(c, bus, keys, { ignoreMute: tag !== 'all', liveEdit });
  if (!g.stops.length){ bus.disconnect(); setStatus('Non ci sono campioni da ascoltare.', true); return; }
  playing = { stops: g.stops, live: g.live, keys, tag, bus, liveEdit }; updateKeys();
}
function restart(){ if (playing) play(playing.keys, playing.tag, playing.liveEdit); }

/* ======================= RENDER OFFLINE ======================= */
async function renderKeys(keys, sec, channels){
  const L = Math.floor(sec*SR), oc = new OfflineAudioContext(channels || 2, L, SR), bus = oc.createGain(); bus.connect(oc.destination);
  buildAll(oc, bus, keys, { ignoreMute: true });
  if (sec > 10){ bus.gain.setValueAtTime(0, 0); bus.gain.linearRampToValueAtTime(1, 1); bus.gain.setValueAtTime(1, sec - 2); bus.gain.linearRampToValueAtTime(0, sec); }
  return oc.startRendering();
}

function wav(buf){ const n = buf.length, ch = buf.numberOfChannels, ab = new ArrayBuffer(44 + n*ch*2), v = new DataView(ab), w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };

  const d = []; for (let c = 0; c < ch; c++) d.push(buf.getChannelData(c)); let o = 44;
  for (let i = 0; i < n; i++) for (let c = 0; c < ch; c++){ const s = Math.max(-1, Math.min(1, d[c][i])); v.setInt16(o, s < 0 ? s*0x8000 : s*0x7FFF, true); o += 2; } return new Uint8Array(ab); }
const CRC = (() => { const t = new Uint32Array(256); for (let i = 0; i < 256; i++){ let c = i; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[i] = c >>> 0; } return t; })();
function crc32(u){ let c = 0xFFFFFFFF; for (let i = 0; i < u.length; i++) c = CRC[(c ^ u[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }

  for (const f of files){ const name = enc.encode(f.name), crc = crc32(f.data), sz = f.data.length, h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint32(14, crc, true); h.setUint32(18, sz, true); h.setUint32(22, sz, true); h.setUint16(26, name.length, true); parts.push(new Uint8Array(h.buffer), name, f.data);
    const cd = new DataView(new ArrayBuffer(46)); cd.setUint32(0, 0x02014b50, true); cd.setUint16(4, 20, true); cd.setUint16(6, 20, true); cd.setUint32(16, crc, true); cd.setUint32(20, sz, true); cd.setUint32(24, sz, true); cd.setUint16(28, name.length, true); cd.setUint32(42, off, true);

  return new Blob([...parts, ...central, new Uint8Array(e.buffer)], { type: 'application/zip' }); }

/* display a sette segmenti: i segmenti spenti restano visibili in trasparenza, come su un LCD Game & Watch */
const SEGMAP = { '0': 'abcdef', '1': 'bc', '2': 'abged', '3': 'abgcd', '4': 'fgbc', '5': 'afgcd', '6': 'afgedc', '7': 'abc', '8': 'abcdefg', '9': 'abcdfg', '-': 'g', ' ': '' };
function seg7(str, h){
  const segs = { a: [1.8, 1.5, 10.2, 1.5, 'h'], g: [1.8, 11, 10.2, 11, 'h'], d: [1.8, 20.5, 10.2, 20.5, 'h'], f: [1.5, 1.8, 1.5, 10.7, 'v'], b: [10.5, 1.8, 10.5, 10.7, 'v'], e: [1.5, 11.3, 1.5, 20.2, 'v'], c: [10.5, 11.3, 10.5, 20.2, 'v'] };
  const poly = (x1, y1, x2, y2, o) => { const t = 1.25; return o === 'h' ? [x1, y1, x1 + t, y1 - t, x2 - t, y1 - t, x2, y1, x2 - t, y1 + t, x1 + t, y1 + t].join(' ') : [x1, y1, x1 + t, y1 + t, x1 + t, y2 - t, x1, y2, x1 - t, y2 - t, x1 - t, y1 + t].join(' '); };
  let x = 0, body = '';
  for (const ch of String(str)){
    if (ch === ':'){ body += '<g class="on"><rect x="' + (x + 1) + '" y="6" width="2.4" height="2.4"/><rect x="' + (x + 1) + '" y="14" width="2.4" height="2.4"/></g>'; x += 5; continue; }
    if (ch === '/'){ body += '<polygon class="on" points="' + (x + 6) + ',1 ' + (x + 7.6) + ',1 ' + (x + 1.6) + ',21 ' + x + ',21"/>'; x += 9; continue; }
    const on = SEGMAP[ch] || '';
    for (const sId in segs){ const [x1, y1, x2, y2, o] = segs[sId]; body += '<polygon class="' + (on.includes(sId) ? 'on' : 'off') + '" points="' + poly(x1 + x, y1, x2 + x, y2, o) + '"/>'; }
    x += 14; }
  return '<svg class="seg7" height="' + h + '" viewBox="-1 0 ' + (x + 1) + ' 22" aria-hidden="true">' + body + '</svg>'; }

  else if (s.t === 'effetto'){ const st = S[s.k]; st.mix = Math.round(Math.max(0, Math.min(1, st.mix + dir*0.05))*100)/100; liveMix(s.k); updateReadout(); }
  else if (s.t === 'mixer'){ if (mixFocus === 'master'){ M.vol = Math.max(-24, Math.min(6, M.vol + dir)); liveMaster(); refreshMaster(); } else setLevel(mixFocus, S[mixFocus].level + dir); }
  wheelAria(); }
(function bindWheel(){ const w = $('wheel'); let y0 = null, acc = 0, moved = false;
  w.addEventListener('pointerdown', (ev) => { y0 = ev.clientY; acc = 0; moved = false; try { w.setPointerCapture(ev.pointerId); } catch (e) {} });
  w.addEventListener('pointermove', (ev) => { if (y0 == null) return; acc += y0 - ev.clientY; y0 = ev.clientY; while (Math.abs(acc) >= 18){ const dd = Math.sign(acc); wheelStep(dd); acc -= dd*18; moved = true; } });
  w.addEventListener('pointerup', (ev) => { if (y0 != null && !moved){ const r = w.getBoundingClientRect(); wheelStep(ev.clientY < r.top + r.height/2 ? 1 : -1); } y0 = null; });
  w.addEventListener('pointercancel', () => { y0 = null; });
  w.addEventListener('wheel', (ev) => { ev.preventDefault(); wheelStep(ev.deltaY < 0 ? 1 : -1); }, { passive: false });
  w.addEventListener('keydown', (ev) => { const dd = { ArrowUp: 1, ArrowRight: 1, ArrowDown: -1, ArrowLeft: -1 }[ev.key]; if (dd){ ev.preventDefault(); wheelStep(dd); } });
  new ResizeObserver(drawWheel).observe(w); drawWheel(); })();

/* ======================= INTERAZIONI ======================= */
$('lcdBody').addEventListener('click', (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return; const s = STEPS[step], act = b.dataset.act;
  if (act === 'shape'){ const st = S[s.k]; if (st.shape !== b.dataset.v){ st.shape = b.dataset.v; st.task = Math.floor(Math.random()*shapeOf(s.k).tasks.length); } render(); }
  else if (act === 'example'){ setSample(s.k, synth(s.k), EXNAME[s.k]); render(); restart(); }
  else if (act === 'quick') quickFill();
  else if (act === 'file') openPicker();
  else if (act === 'focus'){ mixFocus = b.dataset.k; document.querySelectorAll('.strip').forEach((x) => x.classList.toggle('focus', x.dataset.k === mixFocus)); refreshMaster(); wheelAria(); }
  else if (act === 'mute' || act === 'send'){ const k = b.dataset.k; S[k][act] = !S[k][act]; liveTrack(k); refreshStrip(k); }
  else if (act === 'temp'){ M.temp = b.dataset.v === 'neutro' ? null : b.dataset.v; document.querySelectorAll('[data-act=temp]').forEach((x) => x.setAttribute('aria-pressed', String(x.dataset.v === (M.temp || 'neutro')))); liveMaster(); }
  else if (act === 'keep'){ const k = b.dataset.k; S[k].keep = !S[k].keep; b.setAttribute('aria-pressed', String(S[k].keep)); if (playing && playing.tag === 'keep') play(KEYS.filter((x) => S[x].keep), 'keep'); $('saveArea').innerHTML = saveHtml(); updateKeys(); }
  else if (act === 'export') exportZip();
  else if (act === 'save') saveZip();
  else if (act === 'share') shareZip();
});
$('file-in').addEventListener('change', async (ev) => { const t = ev.target, f = t.files && t.files[0]; if (!f) return; const k = STEPS[step].k; if (!k) return; setStatus('Apro ' + f.name + '…');
  try { setSample(k, await decodeToMono(await f.arrayBuffer()), f.name); render(); restart(); setStatus('Caricato: ' + f.name); }
  catch (e) { setStatus('Il file non si apre: prova WAV, MP3 o M4A', true); } t.value = ''; });
async function decodeToMono(ab){ const c = ensureCtx(), buf = await c.decodeAudioData(ab), n = buf.length, x = new Float32Array(n);
  for (let ch = 0; ch < buf.numberOfChannels; ch++){ const dd = buf.getChannelData(ch); for (let i = 0; i < n; i++) x[i] += dd[i]/buf.numberOfChannels; } return x; }

function go(to){ const was = STEPS[step].k; step = to; const now = STEPS[step];
  if (playing && !(now.k && playing.tag === 'solo-' + now.k)) stop();
  render(); if (now.k !== was) $('lcdBody').scrollTop = 0; }
$('kNext').addEventListener('click', () => { const why = canNext(); if (why){ setStatus(why, true); return; } go(step === STEPS.length - 1 ? 0 : step + 1); });
$('kBack').addEventListener('click', () => { if (step > 0) go(step - 1); });
$('kPlay').addEventListener('click', () => { const tag = playTag(); if ($('kPlay').getAttribute('aria-disabled') === 'true'){ setStatus(tag && STEPS[step].k ? 'Prima registra un suono' : 'Non c’è ancora niente da ascoltare', true); return; }
  if (playing && playing.tag === tag){ stop(); return; }
  const keys = tag === 'all' ? KEYS : tag === 'keep' ? KEYS.filter((k) => S[k].keep) : [tag.slice(5)];
  play(keys, tag, STEPS[step].t === 'effetto'); });
$('kRec').addEventListener('click', () => { if ($('kRec').getAttribute('aria-disabled') === 'true'){ setStatus('Rec funziona solo nella schermata di registrazione', true); return; } record(STEPS[step].k); });
/* resa tattile anche da tastiera: il tasto scende mentre Spazio o Invio sono premuti */
document.querySelectorAll('.key').forEach((k) => { k.addEventListener('keydown', (e) => { if (e.key === ' ' || e.key === 'Enter') k.classList.add('down'); }); k.addEventListener('keyup', () => k.classList.remove('down')); k.addEventListener('blur', () => k.classList.remove('down')); });

/* ======================= REGISTRAZIONE ======================= */
let recState = null, micBlocked = false;
function openPicker(){ try { $('file-in').click(); } catch (e) {} }
async function record(k){
  if (recState){ recState.rec.stop(); return; }
  if (micBlocked){ setStatus('Microfono non disponibile: si apre il selettore del telefono', true); openPicker(); return; }
  try { if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof MediaRecorder === 'undefined') throw new Error('unsupported');
    const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
    const c = ensureCtx(), srcN = c.createMediaStreamSource(stream), an = c.createAnalyser(); an.fftSize = 2048; srcN.connect(an);
    const rec = new MediaRecorder(stream), chunks = []; rec.ondataavailable = (e) => chunks.push(e.data);
    const buf = new Float32Array(an.fftSize), t0 = performance.now(), slot = REC_MAX*1000/CITY_N; let acc = 0, cnt = 0, lastSlot = 0;
    rec.onstop = async () => { stream.getTracks().forEach((t) => t.stop()); try { srcN.disconnect(); } catch (e) {} clearInterval(recState.iv); clearTimeout(recState.timer); recState = null;
      try { setSample(k, await decodeToMono(await new Blob(chunks).arrayBuffer()), 'Registrazione delle ' + new Date().toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' })); render(); setStatus('Registrazione pronta'); }
      catch (e) { render(); setStatus('La registrazione non si decodifica in questo browser', true); } };
    stop(); rec.start();
    recState = { k, rec, levels: [], timer: setTimeout(() => rec.state === 'recording' && rec.stop(), REC_MAX*1000),
      iv: setInterval(() => { an.getFloatTimeDomainData(buf); let s = 0; for (const v of buf) s += v*v; acc += Math.sqrt(s/buf.length); cnt++;
        const el = performance.now() - t0, sl = Math.floor(el/slot);
        if (sl > lastSlot){ const rms = acc/Math.max(1, cnt), db = 20*Math.log10(rms + 1e-9); recState.levels.push(Math.max(0, Math.min(1, (db + 58)/46))); acc = 0; cnt = 0; lastSlot = sl; drawCityFor(k); }
        const tm = $('timer'); if (tm) tm.innerHTML = seg7('00:' + pad2(Math.min(REC_MAX, Math.floor(el/1000))), 22); }, 50) };
    render();
  } catch (e) {
    micBlocked = true;
    const why = IN_VIEWER ? 'L’app di Claude non concede il microfono' : (e && e.name === 'NotAllowedError') ? 'Permesso del microfono negato' : 'Questo browser non dà accesso al microfono';
    setStatus(why + ': si apre il selettore del telefono', true); openPicker(); }
}
function quickFill(){
  const pos = { tonica: { x: 0, y: 0.9 }, segnale: { x: 0.9, y: 0 }, impronta: { x: -0.85, y: 0.2 } };
  KEYS.forEach((k) => { const st = S[k]; st.shape = SEC[k].shapes[0].id; st.task = 0; st.pad = pos[k]; setSample(k, synth(k), EXNAME[k]); const dm = padDominant(padWeights(st.pad)); st.eff = dm === 'D' ? null : dm; });
  stop(); go(STEPS.findIndex((x) => x.t === 'mixer')); }
window.addEventListener('resize', () => { if (padState){ sizePad(); kickPad(); } if ($('city')) drawCityFor(STEPS[step].k); });

/* ======================= SALVATAGGIO ======================= */
/* In due tempi: prima si prepara l'archivio (calcolo lungo), poi un secondo tocco lo salva.
   Il secondo tocco serve ai browser del telefono, che accettano un download solo come risposta immediata a un gesto. */
let downloads = null, downloadsChecked = false, prepared = null, busy = false;
if (IN_VIEWER && window.claude.use) window.claude.use('downloads').then((dl) => { downloads = dl; downloadsChecked = true; if (STEPS[step].t === 'lascia') render(); }).catch(() => { downloadsChecked = true; });
function exportSig(){ return JSON.stringify([KEYS.map((k) => { const st = S[k]; return [st.ver, st.keep, st.eff, st.pad, st.level, st.mix, st.send, st.mute]; }), M]); }
function canShareFiles(){ try { return !IN_VIEWER && !!navigator.canShare && navigator.canShare({ files: [new File([new Uint8Array(1)], 'x.zip', { type: 'application/zip' })] }); } catch (e) { return false; } }
function saveHtml(){
  if (prepared && prepared.sig !== exportSig()) prepared = null;
  if (IN_VIEWER && downloadsChecked && !downloads) return '<p class="txt">In questa vista il salvataggio non è disponibile: apri la web app dal browser per salvare.</p>';
  if (!prepared) return '<button class="lcdbtn" style="width:100%" type="button" data-act="export"' + (busy ? ' disabled' : '') + '>' + (busy ? 'Preparo l’archivio…' : 'Prepara la fotografia sonora') + '</button>';
  return '<p class="mono" style="margin-bottom:8px">Pronto · ' + (prepared.blob.size/1048576).toFixed(1) + ' MB</p><div class="row"><button class="lcdbtn on" type="button" data-act="save">Salva il file</button>'
    + (canShareFiles() ? '<button class="lcdbtn" type="button" data-act="share">Condividi</button>' : '') + '</div>'; }
function refreshSave(){ const a = $('saveArea'); if (a) a.innerHTML = saveHtml(); }
function errText(e){ const c = e && e.code;
  if (c === 'declined') return 'Salvataggio annullato';
  if (c === 'too_large') return 'Archivio troppo grande: lascia meno parti';
  if (c === 'rate_limited') return 'C’è già una richiesta di salvataggio aperta';
  return 'Salvataggio non riuscito' + (c ? ' (' + c + ')' : ''); }
async function saveZip(){ if (!prepared) return; const { blob, fname } = prepared;
  try { if (IN_VIEWER){ if (!downloads){ setStatus('Salvataggio non disponibile in questa vista', true); return; } await downloads.save({ filename: fname, data: blob }); setStatus('Archivio salvato'); return; }
    const url = URL.createObjectURL(blob), a = document.createElement('a'); a.href = url; a.download = fname; a.rel = 'noopener'; document.body.appendChild(a); a.click(); setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 60000);
    setStatus('Download avviato'); } catch (e) { setStatus(errText(e), true); } }
async function shareZip(){ if (!prepared) return;
  try { await navigator.share({ files: [new File([prepared.blob], prepared.fname, { type: 'application/zip' })], title: 'Fotografia sonora' }); setStatus('Archivio condiviso'); }
  catch (e) { setStatus(e && e.name === 'AbortError' ? 'Condivisione annullata' : 'Condivisione non riuscita: usa Salva', true); } }
async function exportZip(){
  const keys = KEYS.filter((k) => S[k].keep && S[k].raw); if (!keys.length){ setStatus('Scegli almeno una parte da lasciare', true); return; }
  busy = true; refreshSave();
  try { setStatus('Calcolo il mix e le tracce…');
    const files = [{ name: '0_mix.wav', data: wav(await renderKeys(keys, 30)) }];
    for (const k of keys) files.push({ name: SEC[k].n + '_' + k + '.wav', data: wav(await renderKeys([k], 30)) });
    const info = { master: { temperatura: M.temp || 'neutro', volume_dB: M.vol } };
    for (const k of KEYS){ const st = S[k], sh = shapeOf(k);
      info[k] = { lasciata: st.keep && !!st.raw, forma: sh ? POSTURE[sh.sides].n : null, postura: sh ? POSTURE[sh.sides].t : null, suggerimento: sh && st.task != null ? sh.tasks[st.task] : null, sorgente: st.name,
        impressione: st.raw ? effLabel(k) : null, gesto: st.pad ? { x: +st.pad.x.toFixed(2), y: +st.pad.y.toFixed(2), pesi: Object.fromEntries(Object.entries(padWeights(st.pad)).map(([v, w]) => [padOpt(k, v).s, +w.toFixed(2)])) } : null,
        intensita: st.mix, livello_dB: st.level, eco: st.send, muto_nel_mixer: st.mute }; }
    files.push({ name: 'scelte.json', data: new TextEncoder().encode(JSON.stringify(info, null, 2)) });
    const dt = new Date(), stamp = dt.getFullYear() + pad2(dt.getMonth() + 1) + pad2(dt.getDate()) + '-' + pad2(dt.getHours()) + pad2(dt.getMinutes());
    prepared = { blob: zip(files), fname: 'fotografia-sonora-' + stamp + '.zip', sig: exportSig() };
    busy = false; refreshSave(); setStatus('Archivio pronto: tocca Salva');
  } catch (e) { busy = false; refreshSave(); setStatus('Non riesco a preparare l’archivio', true); } }

render();
window.__fs = { S, SEC, ensureProc, renderKeys, setSample, synth, KEYS, go, STEPS, cityLevels };
})();
